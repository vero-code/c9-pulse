<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C9 Pulse - Esports Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .match-card { transition: transform 0.2s; cursor: pointer; }
        .match-card:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">C9 Pulse</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Recent Matches</h2>
        <div class="row">
            {% for match in matches %}
            <div class="col-md-6 col-lg-4 mb-3">
                <div class="card h-100 shadow-sm match-card" onclick="location.href='/match/{{ match.id }}'">
                    <div class="card-body">
                        <h5 class="card-title">{{ match.versus }}</h5>
                        <p class="card-text text-muted">{{ match.tournament }}</p>
                        <p class="card-text"><small class="text-muted">{{ match.time }}</small></p>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12">
                <p>No matches found or API error.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>

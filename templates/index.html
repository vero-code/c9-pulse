<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C9 Pulse - Esports Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0b0d0f; 
            color: #ffffff;
        }
        .navbar {
            background-color: #00aeef !important;
        }
        .navbar-brand {
            font-weight: bold;
            color: #ffffff !important;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #00aeef, 0 0 30px #00aeef, 0 0 40px #00aeef;
            transition: text-shadow 0.3s ease-in-out;
        }
        .navbar-brand:hover {
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #00aeef, 0 0 40px #00aeef, 0 0 50px #00aeef, 0 0 60px #00aeef;
        }
        .card {
            background-color: #1a1d21;
            border-color: #2d3238;
            color: #ffffff;
        }
        .match-card { 
            transition: transform 0.2s, background-color 0.2s; 
            cursor: pointer; 
        }
        .match-card:hover { 
            transform: scale(1.02); 
            background-color: #25292e;
        }
        .text-muted {
            color: #a0a0a0 !important;
        }
        h2 {
            color: #00aeef;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}"
                     alt="C9 Logo"
                     width="30"
                     height="30"
                     class="d-inline-block align-top me-2">
                C9 Pulse
            </a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Recent Matches</h2>
        <div class="row">
            {% for match in matches %}
            <div class="col-md-6 col-lg-4 mb-3">
                <div class="card h-100 shadow-sm match-card" onclick="location.href='/match/{{ match.id }}'">
                    <div class="card-body">
                        <h5 class="card-title">{{ match.versus }}</h5>
                        <p class="card-text text-muted">{{ match.tournament }}</p>
                        <p class="card-text"><small class="text-muted">{{ match.time }}</small></p>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12">
                <p>No matches found or API error.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
